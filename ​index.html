<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Glitch: Overlord Chronicles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    <canvas id="minimapCanvas" width="105" height="105"></canvas>

    <!-- رسالة مخصصة -->
    <div id="toastMessage" class="toast-message">⚠️ لا تملك عملات كافية!</div>

    <!-- شريط HUD -->
    <div id="hud" style="display: none;">
        <div class="hud-card">
            <div class="hud-text health-text">الصحة | HP</div>
            <div class="bar-container">
                <div id="healthBar"></div>
            </div>
        </div>

        <div class="hud-card">
            <div class="stats-text" id="waveText">الموجة: 1</div>
            <div class="level-hud-text" id="levelText">⭐ المستوى: 1</div>
            <div class="monster-text" id="monsterCountText">الوحوش: 0</div>
        </div>

        <div class="hud-card">
            <div class="coin-hud-text" id="hudCoinText">🪙 0 عملات</div>
            <div class="bar-container">
                <div id="xpBar"></div>
            </div>
            <div class="xp-text" id="xpText" style="font-size:9px;text-align:center;margin-top:2px;">0 / 400 XP</div>
        </div>
    </div>

    <!-- عناصر التحكم -->
    <div id="joystickContainer" style="display: none;">
        <div id="joystickKnob"></div>
    </div>
    <div id="btnDash" style="display: none;">DASH [E]</div>

    <!-- 1. الشاشة الرئيسية Main Menu -->
    <div id="mainMenuModal" class="modal-overlay">
        <div class="modal-title">CYBER GLITCH</div>
        <div class="modal-subtitle" id="menuCoinText">🪙 العملات: 0</div>
        <button class="btn-main" onclick="startGameFromMenu()">إبدأ اللعب ⚔️</button>
        <button class="btn-secondary" onclick="openShopModal()">متجر الشخصيات والألوان 🎨</button>
    </div>

    <!-- 2. متجر تغيير الشخصيات والألوان Shop Modal -->
    <div id="shopModal" class="modal-overlay" style="display: none;">
        <div class="modal-title">متجر الشخصيات</div>
        <div class="modal-subtitle" id="shopCoinText">🪙 العملات: 0</div>
        <div class="cards-container" id="skinsContainer"></div>
        <button class="btn-main" onclick="closeShopModal()">العودة للقائمة ↩️</button>
    </div>

    <!-- 3. شاشة الترقيات Upgrade Modal -->
    <div id="upgradeModal" class="modal-overlay" style="display: none;">
        <div class="modal-title" style="color: #ffd700; text-shadow: 0 0 25px #ffd700;">🚀 ترقية النينجا</div>
        <div class="modal-subtitle" style="color: #00f3ff;">اختر ترقية واحدة لتعزيز قوتك</div>
        <div class="cards-container" id="cardsContainer"></div>
        <button class="btn-skip" onclick="skipUpgrade()">تخطي الترقية ←</button>
    </div>

    <!-- 4. شاشة الموت ونهاية اللعبة Game Over Modal -->
    <div id="gameOverModal" class="modal-overlay" style="display: none;">
        <div class="modal-title" style="color: #ff0055; text-shadow: 0 0 25px #ff0055;">تم اختراق النظام</div>
        <div class="modal-subtitle" id="finalScoreText" style="color: #ffffff;">صمدت حتى الموجة: 1</div>
        <div class="modal-subtitle" id="gainedCoinsText" style="color: #ffd700;">العملات المكتسبة: +0</div>
        <button class="btn-secondary" onclick="restartGameDirectly()">إعادة المحاولة 🔄</button>
        <button class="btn-main" onclick="returnToMainMenu()">العودة للشاشة الرئيسية 🏠</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
